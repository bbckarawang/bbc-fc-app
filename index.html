<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BBC-FC</title>

  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#EE1C25">
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1mC50B-2kjzM8FXwTdsWPEyeGRNXMeu8x">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Loading Screen Fotocopy */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    /* Ukuran Wadah Logo Diperbaiki Agar Rapi */
    .copier-container {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 3px solid #EE1C25;
      border-radius: 20px;
      background: #fafafa;
      box-shadow: 0 6px 20px rgba(238, 28, 37, 0.15);
      overflow: hidden;
      padding: 12px;
    }

    /* Pembatasan Ukuran Logo Supaya Tidak Kegedean */
    .app-logo {
      width: 100%;
      height: 100%;
      max-width: 75px;
      max-height: 75px;
      object-fit: contain;
    }

    /* Sinar Laser Scanner Fotocopy */
    .scanner-light {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: #EE1C25;
      box-shadow: 0 0 12px #EE1C25, 0 0 20px #EE1C25;
      animation: scan 1.6s infinite ease-in-out;
    }

    @keyframes scan {
      0% { top: 0%; opacity: 0.7; }
      50% { top: 94%; opacity: 1; }
      100% { top: 0%; opacity: 0.7; }
    }

    .loading-title {
      font-size: 22px;
      font-weight: 800;
      color: #EE1C25;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .loading-text {
      font-size: 13px;
      color: #777777;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Web App Iframe Full Screen */
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Screen Loading Animasi Scanner -->
  <div id="loading-screen">
    <div class="copier-container">
      <img src="https://lh3.googleusercontent.com/d/1mC50B-2kjzM8FXwTdsWPEyeGRNXMeu8x" alt="BBC-FC Logo" class="app-logo">
      <div class="scanner-light"></div>
    </div>
    <div class="loading-title">BBC-FC</div>
    <div class="loading-text">Memindai dokumen... Mohon tunggu</div>
  </div>

  <!-- Main Iframe Google Apps Script -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/a/macros/pertiwi.ac.id/s/AKfycbzE6a_fmSN97yWjiPaotXviNnDmBPku2CQQApi6BCs4wKbc0B1dR0ObyFWAy6uJyJMt/exec"
    onload="hideLoading()">
  </iframe>

  <script>
    function hideLoading() {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.style.opacity = '0';
        setTimeout(() => {
          loadingScreen.style.visibility = 'hidden';
        }, 400);
      }
    }

    // Waktu cadangan jika iframe selesai dimuat
    setTimeout(hideLoading, 5000);

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Registered'))
          .catch(err => console.log('SW Error:', err));
      });
    }
  </script>
</body>
</html>
